name: Android CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, unit tests and lint
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Run full Gradle verification
        id: gradle
        continue-on-error: true
        run: |
          set +e
          ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug assembleDebugAndroidTest --stacktrace 2>&1 | tee ci-full.log
          status=${PIPESTATUS[0]}
          echo "gradle_exit=$status" >> "$GITHUB_ENV"
          # Compact, size-bounded report that can be read back through the GitHub API.
          {
            echo "=== ERROR LINES ==="
            grep -n -E "^e: |error:|FAILURE:|What went wrong|Caused by|> Task .*FAILED|Unresolved reference|Cannot access|Compilation error" ci-full.log | head -150
            echo
            echo "=== TAIL (300) ==="
            tail -n 300 ci-full.log
          } > ci-report.log
          exit 0

      - name: Publish report to ci-artifacts branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          REPO="$GITHUB_REPOSITORY"
          BASE_REF="arena/ce4df19c-callora-app"
          if ! gh api "repos/$REPO/git/ref/heads/ci-artifacts" >/dev/null 2>&1; then
            BASE_SHA=$(gh api "repos/$REPO/git/ref/heads/$BASE_REF" --jq .object.sha)
            gh api "repos/$REPO/git/refs" -f ref="refs/heads/ci-artifacts" -f sha="$BASE_SHA" >/dev/null
          fi
          B64=$(base64 -w0 ci-report.log | head -c 900000)
          EXISTING=$(gh api "repos/$REPO/contents/ci-report.log?ref=ci-artifacts" --jq .sha 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            gh api "repos/$REPO/contents/ci-report.log" -X PUT \
              -f message="ci: report for run $GITHUB_RUN_ID" \
              -f content="$B64" -f branch="ci-artifacts" -f sha="$EXISTING" >/dev/null
          else
            gh api "repos/$REPO/contents/ci-report.log" -X PUT \
              -f message="ci: report for run $GITHUB_RUN_ID" \
              -f content="$B64" -f branch="ci-artifacts" >/dev/null
          fi

      - name: Fail job when Gradle verification failed
        if: always()
        run: |
          echo "Gradle exit code: ${gradle_exit:-unknown}"
          test "${gradle_exit:-1}" = "0"
