name: Android CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, unit tests and lint
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Build and capture full diagnostic
        id: build
        continue-on-error: true
        run: |
          set +e
          LOG=ci-diagnostic.log
          : > "$LOG"
          {
            echo "=== ENVIRONMENT ==="
            date
            pwd
            ls -la
            echo "--- java ---"
            java -version 2>&1
            echo "--- gradlew perms ---"
            ls -la gradlew gradle/wrapper/
          } >> "$LOG" 2>&1

          chmod +x gradlew
          ./gradlew --no-daemon --console=plain \
            assembleDebug testDebugUnitTest lintDebug assembleDebugAndroidTest \
            --stacktrace >> "$LOG" 2>&1
          echo "gradle_exit=$?" >> "$GITHUB_ENV"
          echo "GRADLE_EXIT_CAPTURED" >> "$LOG"
          tail -n 5 "$LOG"

      - name: Publish diagnostic log to ci-artifacts branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          REPO="$GITHUB_REPOSITORY"
          BASE_REF="arena/ce4df19c-callora-app"
          echo "log size: $(wc -c < ci-diagnostic.log)"
          if ! gh api "repos/$REPO/git/ref/heads/ci-artifacts" >/dev/null 2>&1; then
            BASE_SHA=$(gh api "repos/$REPO/git/ref/heads/$BASE_REF" --jq .object.sha)
            gh api "repos/$REPO/git/refs" \
              -f ref="refs/heads/ci-artifacts" -f sha="$BASE_SHA" >/dev/null
          fi
          B64=$(base64 -w0 ci-diagnostic.log)
          BLOB=$(gh api "repos/$REPO/git/blobs" -f content="$B64" -f encoding=base64 --jq .sha)
          PARENT=$(gh api "repos/$REPO/git/ref/heads/ci-artifacts" --jq .object.sha)
          TREE=$(gh api "repos/$REPO/git/trees" \
            -f base_tree="$PARENT" \
            -f 'tree[][path]=ci-diagnostic.log' \
            -f 'tree[][mode]=100644' \
            -f 'tree[][type]=blob' \
            -f "tree[][sha]=$BLOB" --jq .sha)
          COMMIT=$(gh api "repos/$REPO/git/commits" \
            -f message="ci: diagnostic for run $GITHUB_RUN_ID" \
            -f tree="$TREE" \
            -f 'parents[][sha]='"$PARENT" --jq .sha)
          gh api "repos/$REPO/git/refs/heads/ci-artifacts" -X PATCH \
            -f sha="$COMMIT" -F force=true
          echo "publish_exit=$?"

      - name: Fail job when Gradle verification failed
        if: always()
        run: |
          echo "Gradle exit code: ${gradle_exit:-unknown}"
          test "${gradle_exit:-1}" = "0"
