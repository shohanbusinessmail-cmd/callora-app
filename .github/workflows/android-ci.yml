name: Android CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, unit tests and lint
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Run full Gradle verification
        id: gradle
        continue-on-error: true
        run: |
          set +e
          ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug assembleDebugAndroidTest --stacktrace 2>&1 | tee ci-full.log
          status=${PIPESTATUS[0]}
          echo "gradle_exit=$status" >> "$GITHUB_ENV"
          exit 0

      - name: Publish verification log to ci-artifacts branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          REPO="${GITHUB_REPOSITORY}"
          ART=/tmp/ci-artifacts
          rm -rf "$ART"
          if ! git clone --depth 1 --branch ci-artifacts "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "$ART" 2>/dev/null; then
            mkdir -p "$ART"
            cd "$ART"
            git init -b ci-artifacts
            git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          else
            cd "$ART"
          fi
          git config user.email "ci@callora.local"
          git config user.name "Callora CI"
          cp "$GITHUB_WORKSPACE/ci-full.log" ./ci-full.log
          {
            echo "# CI log"
            echo
            echo "Run: $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT on $GITHUB_REF_NAME @ $GITHUB_SHA"
            echo "Gradle exit: ${gradle_exit:-unknown}"
          } | cat - ci-full.log > ci-full.log.new && mv ci-full.log.new ci-full.log
          git add ci-full.log
          git commit -m "ci: log for run $GITHUB_RUN_ID" || true
          git branch -M ci-artifacts
          git push -f origin ci-artifacts

      - name: Fail job when Gradle verification failed
        if: always()
        run: |
          echo "Gradle exit code: ${gradle_exit:-unknown}"
          test "${gradle_exit:-1}" = "0"
