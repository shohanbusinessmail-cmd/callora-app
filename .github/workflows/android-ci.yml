name: Android CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, unit tests and lint
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle wrapper
        id: wrapper
        continue-on-error: true
        uses: gradle/actions/wrapper-validation@v4

      - name: Build and capture full diagnostic
        id: build
        if: always()
        continue-on-error: true
        run: |
          set +e
          LOG=ci-diagnostic.log
          : > "$LOG"
          {
            echo "=== ENVIRONMENT ==="
            date
            pwd
            ls -la
            echo "--- java ---"
            java -version 2>&1
            echo "--- wrapper validation conclusion: ${{ steps.wrapper.outcome }} ---"
            echo "--- gradlew perms ---"
            ls -la gradlew gradle/wrapper/
            echo "=== GRADLE WRAPPER BOOTSTRAP ==="
            chmod +x gradlew
            ./gradlew --no-daemon --version
            echo "wrapper_bootstrap_exit=$?"
            echo "=== GRADLE BUILD ==="
            ./gradlew --no-daemon --console=plain \
              assembleDebug testDebugUnitTest lintDebug assembleDebugAndroidTest \
              --stacktrace
            echo "gradle_exit=$?"
          } >> "$LOG" 2>&1
          grep -E "^gradle_exit=" "$LOG" >> "$GITHUB_ENV" || echo "gradle_exit=1" >> "$GITHUB_ENV"
          echo "--- log tail ---"
          tail -n 10 "$LOG"

      - name: Publish diagnostic log
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          LOG="$GITHUB_WORKSPACE/ci-diagnostic.log"
          [ -s "$LOG" ] || echo "no build log was produced" > "$LOG"
          ART="$RUNNER_TEMP/ci-artifacts"
          rm -rf "$ART"
          if ! git clone --depth 1 --branch ci-artifacts \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$ART"; then
            mkdir -p "$ART"
            cd "$ART"
            git init -b ci-artifacts
            git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          else
            cd "$ART"
          fi
          git config user.email "ci@callora.local"
          git config user.name "Callora CI"
          git checkout --orphan fresh 2>/dev/null
          git rm -rf --cached . >/dev/null 2>&1 || true
          find . -maxdepth 1 -mindepth 1 ! -name .git -exec rm -rf {} +
          cp "$LOG" ./ci-diagnostic.log
          git add ci-diagnostic.log
          git commit -m "ci: diagnostic for run $GITHUB_RUN_ID"
          git branch -M ci-artifacts
          git push -f origin ci-artifacts
          echo "publish_exit=$?"

      - name: Fail job when Gradle verification failed
        if: always()
        run: |
          echo "Gradle exit code: ${gradle_exit:-unknown}"
          test "${gradle_exit:-1}" = "0"
