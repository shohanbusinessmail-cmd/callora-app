name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (must already exist, e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build APK and publish GitHub release
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # The hosted runner image ships a complete Android SDK; the
      # setup-android action fails on ubuntu-24.04 and is unnecessary.
      - name: Accept Android licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Determine release tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Create GitHub release and attach APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n1)
          cp "$APK" "callora-${TAG}-debug.apk"
          gh release create "$TAG" \
            "callora-${TAG}-debug.apk" \
            --title "Callora $TAG" \
            --notes-file docs/release-notes.md \
            --verify-tag
